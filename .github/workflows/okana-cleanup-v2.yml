name: Clean approved Okana cutouts without altering character identity
on:
  push:
    paths:
      - .github/workflows/okana-cleanup-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic imaging dependencies
        run: python -m pip install --quiet Pillow numpy opencv-python-headless
      - name: Preserve original poses and remove detached pixels only
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np, cv2
          from pathlib import Path
          
          p=Path("world-characters/okana")
          items=[
            ("portrait","portrait-display.png"),
            ("pose-1-noble","pose-1-noble-display.png"),
            ("pose-2-cutting-remark","pose-2-cutting-remark-display.png"),
            ("pose-3-inazuma-punch","pose-3-inazuma-punch-display.png"),
            ("pose-4-mother-memory","pose-4-mother-memory-display.png")
          ]
          COL_W,COL_H=390,520
          contact=Image.new("RGB",(COL_W*len(items),COL_H*2),(13,24,21))
          report=[]
          for j,(name,filename) in enumerate(items):
            src=Image.open(p/filename).convert("RGBA")
            pixels=np.array(src)
            alpha=pixels[:,:,3].copy()
            if alpha.min() > 0 or alpha.max() < 240: raise RuntimeError("Not a proper transparent character: "+filename)
            threshold=(alpha>11).astype("uint8")
            num,labels,stats,cent=cv2.connectedComponentsWithStats(threshold,8)
            sizes=stats[1:,4]
            biggest=1+int(np.argmax(sizes))
            main=(labels==biggest).astype("uint8")
            near=cv2.dilate(main,np.ones((17,17),np.uint8))
            drop=np.zeros(alpha.shape,bool)
            floating=[]
            for k in range(1,num):
              if k==biggest: continue
              area=int(stats[k,4])
              comp=(labels==k)
              # Remove unattached specks; preserve any real detached accessories,
              # hairs or whiskers by size or proximity to the main silhouette.
              if area<85 and not np.any(near[comp]):
                drop|=comp
                floating.append(area)
            alpha[alpha<=6]=0
            alpha[drop]=0
            pixels[:,:,3]=alpha
            # The original pixels and all significant silhouette regions remain untouched.
            old=np.count_nonzero(threshold)
            left=np.count_nonzero(alpha>11)
            retained=left/old
            if retained < .9995: raise RuntimeError(f"Too much subject removed: {name}, {retained:.6f}")
            # Leave all limbs, hair, accessory and costume pixels intact; only
            # transparent edge padding is added, never crop.
            edited=Image.fromarray(pixels,"RGBA")
            outer=Image.new("RGBA",(edited.width+96,edited.height+96),(0,0,0,0))
            outer.alpha_composite(edited,(48,48))
            outname=name+"-clean-v2.png"
            outer.save(p/outname,optimize=True)
            # Verify body extends nowhere near canvas edge.
            a=np.array(outer)[:,:,3]
            border=max(24,int(min(a.shape)*0.017))
            if np.count_nonzero(a[:border,:]>10)+np.count_nonzero(a[-border:,:]>10)+np.count_nonzero(a[:,:border]>10)+np.count_nonzero(a[:,-border:]>10)>0:
              raise RuntimeError(f"Character still reaches border in {name}")
            # compare old and new over dark ground; white specks stand out on dark
            for row,im in [(0,src),(1,outer)]:
              mini=im.copy()
              mini.thumbnail((COL_W-22,COL_H-58),Image.Resampling.LANCZOS)
              x=j*COL_W+(COL_W-mini.width)//2
              y=row*COL_H+20+(COL_H-70-mini.height)//2
              contact.paste(mini,(x,y),mini)
              d=ImageDraw.Draw(contact)
              d.text((j*COL_W+13,(row+1)*COL_H-30),("BEFORE  " if row==0 else "AFTER   ")+name,fill=(232,204,166))
            report.append(f"{name}\tsize:{src.size}\tmain: {int(sizes.max())}\tislands:{num-1}\tremoved:{floating}\tretained:{retained:.7f}\toutput:{outer.size}")
          contact.save(p/"okana-QA-before-after.jpg",quality=88,optimize=True)
          (p/"okana-QA-report.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report))
          PY
      - name: Save cleaned approved art and QA proofs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-characters/okana/*-clean-v2.png world-characters/okana/okana-QA-before-after.jpg world-characters/okana/okana-QA-report.txt
          if ! git diff --cached --quiet; then git commit -m 'Clean isolated pixel specks and pad Okana complete artwork'; git push; fi
