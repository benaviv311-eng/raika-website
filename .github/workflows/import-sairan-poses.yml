name: Import approved Sairan Artlist poses
on:
  push:
    paths:
      - '.github/workflows/import-sairan-poses.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved artwork into website repository
        env:
          ART_2: "https://cms-toolkit-artifacts.artlist.io/content/-e-x-t-e-r-n-a-l_-i-m-a-g-e_-t-o_-i-m-a-g-e-v1/media__1/image-807fb27f-49d1-43b9-8488-d3208f3463b4.png?Expires=2110011711&Key-Pair-Id=K2ZDLYDZI2R1DF&Signature=Lgge1ij8GbZOIo0zgUUiYf5Ugv52ZffaluYX1sjDbd9GsuBgR9YnUplIULURxkqDauAE8ZuDNnHoNshL4M~nlhmdNC0F1gguTI07J91yjFAnX6IvZJqm~ziyoQye0~q-4T25CeFu9cM~BYOVFQdEkYgrW31ZXmrj7~d0DuHil41sir5KwJhassA3cWgv6nnuN~R4WrJ60EXYKnBuEDPLITtg2e-EN6UUwJU2PNv6RjAzGPpDuGYfx9auGOu0Ab30gHBgKqnAE5iWjFzizTpCiX3uvCViv1U-74QLszC0UJ8AjnmNhh-VSZfrO6ehz7Dyu-2tvMARUbIporOyB9x8yw__"
          ART_3: "https://cms-toolkit-artifacts.artlist.io/content/-e-x-t-e-r-n-a-l_-i-m-a-g-e_-t-o_-i-m-a-g-e-v1/media__3/image-1e467b42-2b9c-484f-bf27-5ca4dab45f87.png?Expires=2110012620&Key-Pair-Id=K2ZDLYDZI2R1DF&Signature=wAweY0X7vLVMbdGWydwRILqNqpKNyOsfrag01SAxLUKj8MR0vM5uyMjlQwNc3CWD2m2wY65~kIbJutzsX1Y2y3dSCcoxdTP4u71678wGOalK1pFEYcIEqwS-T9A7ws15dE8X8w3yz30Reozh08-7-~DHL40lA2nUrYqtEGS9Q0-ZTlxkLU3sdsmS9wYhRBppIeR9bEHdtRnD5IbECv~-k4Nhln1bYXxWoiHhrnXmeDT4tinPJ2GG7SYX56G5q3onkKY5xifqhQub~v2UtnsVAQigRboeZFIRUYQWxdSsmJmsTv5-4olwPSXy3MMjws~UtKiTY3lZr7~dn5URVCUWMg__"
          ART_4: "https://cms-toolkit-artifacts.artlist.io/content/-e-x-t-e-r-n-a-l_-i-m-a-g-e_-t-o_-i-m-a-g-e-v1/media__1/image-de369b69-e206-42ed-91db-b308ba3ca0fc.png?Expires=2110012962&Key-Pair-Id=K2ZDLYDZI2R1DF&Signature=J-cm-aC66s6ClvDcA2XXcLK6t8NWe86h4tLXmJl9NWBT65cwYSuJI5QC9PaoNB-E6swrJeB8OLwJgKkt77grs1FXDtfdikryWZWFKnMb88Ml0PQkseY01B0gE2WE3iKDw7dE~t2vMMfaNJ~wcwhkiYOoLs-ObhBbP6oZC-acOHy0BXMUE0G2~Btmr-D3v4eMuTKclNFYks5QZ4kECldA8gzlOpVGDDFQF-9XdD4bB-fGhMx5~Tf1KKURkQRs-141BKdcCV0majockjKb1TnXieNBfK4cNY8NsZtM9oDk6J2-Jw2RSSTvpo8BAinnTIPxKF-VE39OCF3CCujbtHsYEw__"
        run: |
          set -euo pipefail
          mkdir -p world-characters
          curl --fail --show-error --silent --location --retry 3 --output world-characters/sairan-hammer-kick-approved.png "$ART_2"
          test "$(head -c 4 world-characters/sairan-hammer-kick-approved.png | od -An -tx1 | tr -d ' \n')" = "89504e47"
          curl --fail --show-error --silent --location --retry 3 --output world-characters/sairan-lightning-summon-approved.png "$ART_3"
          test "$(head -c 4 world-characters/sairan-lightning-summon-approved.png | od -An -tx1 | tr -d ' \n')" = "89504e47"
          curl --fail --show-error --silent --location --retry 3 --output world-characters/sairan-lightning-defense-approved.png "$ART_4"
          test "$(head -c 4 world-characters/sairan-lightning-defense-approved.png | od -An -tx1 | tr -d ' \n')" = "89504e47"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-characters/sairan-*-approved.png
          if ! git diff --cached --quiet; then
            git commit -m "Add three approved Sairan Artlist combat poses"
            git push
          fi
