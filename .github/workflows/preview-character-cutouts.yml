name: Build character transparency QA preview

on:
  push:
    branches: [main]
    paths: [".github/workflows/preview-character-cutouts.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create small transparent-background comparison sheet
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import base64
          names=['raika','rai','hikari','raigo','raiko']
          cell_w,cell_h=150,245
          sheet=Image.new('RGB',(cell_w*len(names),cell_h),(20,31,26))
          draw=ImageDraw.Draw(sheet)
          for i,name in enumerate(names):
              image=Image.open(Path('family-cutouts')/(name+'.webp')).convert('RGBA')
              image.thumbnail((140,210))
              x=i*cell_w+(cell_w-image.width)//2
              y=8+(210-image.height)
              sheet.paste(image,(x,y),image)
              draw.text((i*cell_w+10,224),name,fill=(235,208,160))
          import io
          buff=io.BytesIO()
          sheet.save(buff,format='JPEG',quality=62,optimize=True)
          Path('family-cutouts/qa-sheet.jpg.base64.txt').write_text(base64.b64encode(buff.getvalue()).decode('ascii'))
          print('Sheet bytes:',len(buff.getvalue()),'dimensions:',sheet.size)
          PY
      - name: Commit QA output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-cutouts/qa-sheet.jpg.base64.txt
          git commit -m "Generate QA sheet for character cutouts"
          git push origin main
