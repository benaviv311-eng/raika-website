name: Publish clean-alpha character cutouts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cutout-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-transparent-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip leaked background RGB and verify transparent PNG
        run: |
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image,ImageDraw
          import numpy as np
          from pathlib import Path
          import io,base64
          names=('raika','rai','hikari','raigo','raiko')
          out=Path('family-cutouts-v2')
          out.mkdir(exist_ok=True)
          contact=Image.new('RGB',(5*200,350),(16,25,23))
          drawer=ImageDraw.Draw(contact)
          for i,name in enumerate(names):
              source=Image.open(Path('family-clean/isnet-general-use')/(name+'.webp')).convert('RGBA')
              array=np.array(source)
              alpha=array[:,:,3].copy()
              # Keep hair/fur edge softness; only remove leftover translucent background.
              alpha[alpha<48]=0
              alpha[alpha>246]=255
              array[:,:,3]=alpha
              # Transparent pixels MUST NOT carry stray orange/purple studio RGB.
              array[alpha==0,0:3]=0
              png=Image.fromarray(array,'RGBA')
              target=out/(name+'.png')
              png.save(target,'PNG',optimize=True)
              check=Image.open(target).convert('RGBA')
              c=np.asarray(check)
              assert np.array_equal(c,array)
              assert (c[c[:,:,3]==0,:3]==0).all()
              assert (c[:,:,3]==0).mean()>.6
              assert c[200,900,3]==0 and c[500,900,3]==0
              print(name, 'PNG bytes',target.stat().st_size,'transparent',round((alpha==0).mean(),3),'nonzero RGB on 0-alpha',int(np.count_nonzero(c[alpha==0,:3])))
              thumb=check.copy()
              thumb.thumbnail((190,315),Image.Resampling.LANCZOS)
              px=i*200+(200-thumb.width)//2
              py=8+315-thumb.height
              contact.paste(thumb,(px,py),thumb.getchannel('A'))
              drawer.text((i*200+10,328),name,fill=(239,219,185))
          output=io.BytesIO()
          contact.save(output,'JPEG',quality=86,optimize=True)
          (out/'contact-sheet.jpg.base64.txt').write_text(base64.b64encode(output.getvalue()).decode('ascii'))
          PY
      - name: Commit verified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-cutouts-v2
          git commit -m "Add cleaned transparent family portraits with zeroed background RGB"
          git push origin main
