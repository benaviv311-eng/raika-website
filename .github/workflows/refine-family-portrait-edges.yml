name: Feather family silhouettes without altering character design

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-family-portrait-edges.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependencies
        run: python -m pip install Pillow numpy scipy
      - name: Feather hard-cut edges and build A-B review
        run: |
          python - <<'PY'
          import numpy as np, base64, io
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          from scipy.ndimage import distance_transform_edt, gaussian_filter
          names=['raika','rai','hikari','raigo','raiko']
          out=Path('family-feathered')
          out.mkdir(exist_ok=True)
          cell_w,cell_h=235,350
          qa=Image.new('RGB',(cell_w*len(names),cell_h*2),(12,20,18))
          painter=ImageDraw.Draw(qa)
          for i,name in enumerate(names):
              src=Image.open(Path('family-cutouts-v2')/(name+'.png')).convert('RGBA')
              a=np.array(src,dtype=np.uint8)
              old=a[:,:,3].copy()
              blurred=gaussian_filter(old.astype(np.float32),sigma=1.25)
              newalpha=np.clip(np.rint(blurred),0,255).astype(np.uint8)
              newalpha[newalpha<3]=0
              newalpha[newalpha>252]=255
              # Extend real subject colors into newly softened alpha pixels to avoid black/dark halos.
              spread=(old==0)&(newalpha>0)
              if np.any(spread):
                  iy,ix=distance_transform_edt(old==0,return_distances=False,return_indices=True)
                  a[spread,:3]=a[iy[spread],ix[spread],:3]
              a[:,:,3]=newalpha
              a[newalpha==0,:3]=0
              portrait=Image.fromarray(a,'RGBA')
              portrait.save(out/(name+'.png'),'PNG',optimize=True)
              assert portrait.size==src.size
              assert np.all(a[newalpha==0,:3]==0)
              assert (newalpha>0).sum() >= (old>0).sum()
              print(name,'feathered pixels',int(((newalpha>0)&(newalpha<255)).sum()),'old edge count',int(((old>0)&(old<255)).sum()))
              for row,im in enumerate([src,portrait]):
                  thumb=im.copy()
                  thumb.thumbnail((220,312),Image.Resampling.LANCZOS)
                  x=i*cell_w+(cell_w-thumb.width)//2
                  y=row*cell_h+10+312-thumb.height
                  backdrop=Image.new('RGBA',thumb.size,(12,20,18,255))
                  glowmask=thumb.getchannel('A').filter(ImageFilter.GaussianBlur(12))
                  glowmask=glowmask.point(lambda v: round(v*.24))
                  warm=Image.new('RGBA',thumb.size,(232,177,101,0))
                  warm.putalpha(glowmask)
                  backdrop.alpha_composite(warm)
                  backdrop.alpha_composite(thumb)
                  qa.paste(backdrop.convert('RGB'),(x,y))
                  painter.text((i*cell_w+10,row*cell_h+332),('BEFORE ' if row==0 else 'AFTER ')+name,fill=(246,216,169))
          outbuf=io.BytesIO()
          qa.save(outbuf,'JPEG',quality=89,optimize=True)
          (out/'qa-feather.jpg.base64.txt').write_text(base64.b64encode(outbuf.getvalue()).decode('ascii'))
          PY
      - name: Commit feathered cutouts for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-feathered/
          git commit -m "Add anti-aliased cutouts and silhouette glow comparison"
          git push origin main
