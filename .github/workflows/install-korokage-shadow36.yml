name: Add Korokage Shadow Mist 36 as extra character pose
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-korokage-shadow36.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation
        run: python -m pip install "Pillow>=11"
      - name: Rebuild exact image 36, validate and append a separate pose without replacing original
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,re
          from PIL import Image
          root=Path('.github/transfer')
          parts=[root/f'korokage-shadow36-part{i:02d}.txt' for i in range(1,7)]
          assert all(p.exists() for p in parts), 'Missing transfer chunks'
          for p in parts:
              assert len(p.read_text().strip())==3056, f'Unexpected chunk size: {p}'
          data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          sha=hashlib.sha256(data).hexdigest()
          expected='2da64e0c2cce34be9b3c3a361e162418e631d7cca6d51c3530fe484ac88ca2e4'
          if sha!=expected:
              raise RuntimeError('Approved file transfer checksum mismatch: '+sha)
          dest=Path('world-characters/korokage/shadow-mist-eyes-only-v36.webp')
          if dest.exists() and dest.read_bytes()!=data:
              raise RuntimeError('Refusing to overwrite existing art!')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(data)
          with Image.open(dest) as im:
              im.verify()
          with Image.open(dest) as im:
              if im.size!=(900,507) or im.format!='WEBP':
                  raise RuntimeError('Incorrect art dimensions or image type')
          idx=Path('index.html')
          html=idx.read_text()
          start=html.index('    korokage: {')
          stop=html.index('    sairan: {',start)
          before, block, after=html[:start],html[start:stop],html[stop:]
          if 'Shadow Mist — Eyes in Smoke' not in block:
              rx=r'(\{label: "Shadow Mist", image: "[^"]+", alt: "[^"]+"\})'
              matches=list(re.finditer(rx,block))
              if len(matches)!=1:
                  raise RuntimeError('Expected exactly one preexisting Shadow Mist pose')
              extra='{label: "Shadow Mist — Eyes in Smoke", image: "world-characters/korokage/shadow-mist-eyes-only-v36.webp?v=20261119-36", alt: "Korokage almost fully concealed by dark smoke, only his icy-blue eyes and small beak visible"}'
              match=matches[0]
              block=block[:match.end()]+',\n        '+extra+block[match.end():]
              idx.write_text(before+block+after)
          # Keep original asset unchanged. This operation appends only.
          if block.count('label: "Shadow Mist"')!=1 or block.count('label: "Shadow Mist — Eyes in Smoke"')!=1:
              raise RuntimeError('Pose append verification failed')
          Path('world-characters/korokage/shadow-mist-eyes-only-v36-metadata.json').write_text(
              json.dumps({'name':'Shadow Mist — Eyes in Smoke','number':36,
                         'source':'User-approved original artwork (2026-11-16) optimized for site',
                         'display':'world-characters/korokage/shadow-mist-eyes-only-v36.webp',
                         'width':900,'height':507,'sha256':sha,'displayBytes':len(data),
                         'preserveExistingShadowMist':True},ensure_ascii=False,indent=2))
          print('Verified and appended new variant #36; original Shadow Mist preserved; sha256',sha)
          PY
      - name: Commit only additional variant and retained originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html world-characters/korokage/shadow-mist-eyes-only-v36.webp world-characters/korokage/shadow-mist-eyes-only-v36-metadata.json
          git rm -q .github/transfer/korokage-shadow36-part*.txt
          git commit -m "Add Korokage Shadow Mist eyes-only v36 as additional pose, preserve original"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
