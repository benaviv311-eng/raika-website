name: Import Okana approved character portraits
on:
  push:
    paths:
      - .github/workflows/import-okana-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-okana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Okana art without alteration
        run: |
          set -euo pipefail
          mkdir -p world-characters/okana
          curl --fail --location --retry 3 --silent --show-error --output world-characters/okana/portrait.png 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9a33741d-33cf-47b3-a060-9afb399228af.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2EwNTdlMzcyZTllMDk2MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTEwNDgyM30.IGAVL5zgV_PPXvwiGg5vuGhBSpohO6laOcIQm_jo2j8'
          test "$(wc -c < world-characters/okana/portrait.png)" -gt 100000
          file world-characters/okana/portrait.png
          curl --fail --location --retry 3 --silent --show-error --output world-characters/okana/pose-1-noble.png 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/eed87d51-fdeb-46eb-8b92-45ca125d391b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTg2NDI1NzM2OWIyNDRjZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTE2MTA3NX0.rPZKh1iK-3mBQJVrCBf_N5vISqX_IYcAjrSeAnBWu7c'
          test "$(wc -c < world-characters/okana/pose-1-noble.png)" -gt 100000
          file world-characters/okana/pose-1-noble.png
          curl --fail --location --retry 3 --silent --show-error --output world-characters/okana/pose-2-cutting-remark.png 'https://cms-toolkit-artifacts.artlist.io/content/-e-x-t-e-r-n-a-l_-i-m-a-g-e_-t-o_-i-m-a-g-e-v1/media__1/image-5004999f-6663-411e-b6a9-15be303ab16e.png?Expires=2110355634&Key-Pair-Id=K2ZDLYDZI2R1DF&Signature=iBohI67dbost6nfmzu3WWNrZG1zLyjq93DZeOCUHCbgeZ4x8bU9rZwGdojgGXGZ8WFTTEDy5Z4qq~3tYLdJoWyxdB2S9A3~z3kzFpkCuW6DlSn~PyEEFw0do5Xp2mrXr5iIKYgrHFDeuT06AvswxYNumcMAc93Qkok0Euz4Lf67yb~-oHEktNJgEKtutIUhsag8n7YAkdaPLUr-svWilRBV~AkSutVegzw3UVa-TJe5aaxlosDNd4g6KcYok1TGR0qo4dzY81Nj38H2x7-~d~3BLh0p-BBqtv7UR1F24RPvmVvxObTtW7s0odRTKXDjRFTpvUn04GSVN8XCUZJA7bg__'
          test "$(wc -c < world-characters/okana/pose-2-cutting-remark.png)" -gt 100000
          file world-characters/okana/pose-2-cutting-remark.png
          curl --fail --location --retry 3 --silent --show-error --output world-characters/okana/pose-3-inazuma-punch.png 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c2c36829-cf42-4f7b-b7a5-66bb5b40a7e3.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDA4ODBkOWRiMTJkYTY0NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTExMjYwNX0.roWWcEDMhK-KzJ2u58J_rvrJXf49cMRqXfmQIxl765c'
          test "$(wc -c < world-characters/okana/pose-3-inazuma-punch.png)" -gt 100000
          file world-characters/okana/pose-3-inazuma-punch.png
          curl --fail --location --retry 3 --silent --show-error --output world-characters/okana/pose-4-mother-memory.png 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/6c6957d9-cf29-473b-a68c-5a2303ce7d0a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjc4MGI3MmYzMTIwYTJlZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTEwNTMyN30.xnVLi9xgnuc9toUFfK-XrXOvMUlymRshnFTnl4Kxd_g'
          test "$(wc -c < world-characters/okana/pose-4-mother-memory.png)" -gt 100000
          file world-characters/okana/pose-4-mother-memory.png
      - name: Commit and push approved character art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-characters/okana/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Import approved Okana portrait and four character poses"
            git push
          fi
