name: Sairan Artlist originals reference (review only)

on:
  push:
    branches: [review/sairan-cleanup-20261118]
    paths: [.github/workflows/sairan-originals-reference.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/sairan-cleanup-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy
      - name: Build exact Artlist source comparison (no retouching)
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageOps
          from pathlib import Path
          import numpy as np,json,io,base64
          root=Path('world-characters')
          out=root/'review-preview/sairan-artlist-originals-20261118'
          out.mkdir(parents=True,exist_ok=True)
          poses=[
            ('1. PALM STRIKE','sairan-palm-strike-approved.png',None),
            ('2. LIGHTNING HAMMER KICK','sairan-hammer-kick-approved.png',(800,0,2110,1536)),
            ('3. SUMMON LIGHTNING','sairan-lightning-summon-approved.png',(825,0,1960,1536)),
            ('4. LIGHTNING DEFENSE','sairan-lightning-defense-approved.png',(480,0,2270,1536)),
          ]
          cw,ch=490,620
          sheet=Image.new('RGB',(cw*4,ch*2),(14,25,21))
          draw=ImageDraw.Draw(sheet)
          records=[]
          for i,(label,filename,zoom) in enumerate(poses):
            im=Image.open(root/filename).convert('RGBA')
            W,H=im.size
            a=np.asarray(im.getchannel('A'))
            rec={'pose':label,'filename':filename,'size':[W,H],'alpha_0_fraction':round(float((a==0).mean()),3),'alpha_255_fraction':round(float((a==255).mean()),3),'zoom':zoom}
            records.append(rec)
            for row in range(2):
              area=im.copy() if row==0 or zoom is None else im.crop((min(zoom[0],W),min(zoom[1],H),min(zoom[2],W),min(zoom[3],H)))
              area.thumbnail((cw-30,ch-77),Image.Resampling.LANCZOS)
              px=i*cw+(cw-area.width)//2;py=row*ch+31+(ch-90-area.height)//2
              # Matte the transparent original solely for preview; no source pixel edits
              backing=Image.new('RGBA',area.size,(14,25,21,255))
              backing.alpha_composite(area)
              sheet.paste(backing.convert('RGB'),(px,py))
              draw.text((i*cw+15,row*ch+10),label,fill=(246,222,182))
              draw.text((i*cw+15,(row+1)*ch-29),'ORIGINAL 100%' if row==0 else 'FRAMING ONLY / ORIGINAL PIXELS',fill=(205,206,197))
          sheet.save(out/'comparison.jpg',quality=86,optimize=True)
          b=io.BytesIO();sheet.save(b,'JPEG',quality=68,optimize=True)
          (out/'comparison.jpg.base64.txt').write_text(base64.b64encode(b.getvalue()).decode('ascii'))
          (out/'source-inspection.json').write_text(json.dumps(records,indent=2))
          print(records)
          PY
      - name: Store only references on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-characters/review-preview/sairan-artlist-originals-20261118/
          git diff --cached --quiet && exit 0
          git commit -m "Inspect approved Sairan Artlist PNG sources without modifying artwork"
          git push origin HEAD:review/sairan-cleanup-20261118
