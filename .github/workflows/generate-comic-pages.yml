name: Generate comic reader pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/generate-comic-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-comic-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check whether page images already exist
        id: existing
        shell: bash
        run: |
          if [ -f comic-pages/page-1.webp ] && [ -f comic-pages/page-2.webp ] && [ -f comic-pages/page-3.webp ] && [ -f comic-pages/page-4.webp ] && [ -f comic-pages/page-5.webp ] && [ -f comic-pages/page-6.webp ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF rendering tools
        if: steps.existing.outputs.ready != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils webp
          python -m pip install --upgrade gdown

      - name: Download the approved comic PDF
        if: steps.existing.outputs.ready != 'true'
        run: |
          gdown "https://drive.google.com/uc?id=1P5WU3eBgS8wy1W-t47UcNedQyRoGCSBA" -O /tmp/raika-comic.pdf
          test "$(head -c 4 /tmp/raika-comic.pdf)" = "%PDF"
          pages="$(pdfinfo /tmp/raika-comic.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" = "6"
          mkdir -p /tmp/raika-render comic-pages
          pdftoppm -jpeg -r 125 -jpegopt quality=92 /tmp/raika-comic.pdf /tmp/raika-render/page
          for file in /tmp/raika-render/page-*.jpg; do
            name="$(basename "$file" .jpg)"
            cwebp -quiet -q 84 -resize 1300 0 "$file" -o "comic-pages/$name.webp"
          done
          test "$(find comic-pages -maxdepth 1 -name 'page-*.webp' | wc -l)" -eq 6

      - name: Commit rendered pages
        if: steps.existing.outputs.ready != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comic-pages/page-*.webp
          git commit -m "Add individual comic page images for page-turn reader"
          git push origin main
