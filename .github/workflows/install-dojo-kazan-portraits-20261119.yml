name: Install three approved Dojo Kazan portraits at native resolution
on:
  push:
    paths:
      - '.github/workflows/install-dojo-kazan-portraits-20261119.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download three user-approved character portraits
        env:
          SHINPI_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1536/quality:100/uri:ifs%3A%2F%2FM%2F8671ba7f-e1ef-4c36-8ae5-97a31c0c22b7/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAGEnNF6M-zKZ07rIMMqfkjsGw3itYMTH19buOkRJC6v_&exp=1795093697&osig=AAAAAAAAAAAAAAAAAAAAAAusozGeNidtdah2ieIpqFareWyYpdwd6-CF2GJ5wTi9&signer=media-rpc&token=AAIAAU0AJDg2NzFiYTdmLWUxZWYtNGMzNi04YWU1LTk3YTMxYzBjMjJiNwAAAAABofPsEeiiYqM_Hdv0bWPh4cplCq6_gJf9mhFS5OWv1M98jEvDaQ'
          IWAO_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1536/quality:100/uri:ifs%3A%2F%2FM%2F3ec6f5b1-7620-4e58-84b6-d8d93acb4f22/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAJVujYiO49SDR4Tdjz7CBf_lXGurvxbsoxi4EnwpOjv3&exp=1795093781&osig=AAAAAAAAAAAAAAAAAAAAAByNK_tDeLgi1Slr1fllVoMc5HzawtkEO8wlDIqXT1c2&signer=media-rpc&token=AAIAAU0AJDNlYzZmNWIxLTc2MjAtNGU1OC04NGI2LWQ4ZDkzYWNiNGYyMgAAAAABofPtWghO1pbp29ft_k8YlBJoUidZjgbHYAmiWRlePbz609cPGw'
          GENKI_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1536/quality:100/uri:ifs%3A%2F%2FM%2F953cde20-7fa9-4ff0-8a42-790c4b04f224/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAFskr2INOUpOKbbwgrJGjfBYTU63aKgGJYqbl2hyOPxb&exp=1795095597&osig=AAAAAAAAAAAAAAAAAAAAAMpIyfAIZUzwEe3qoNhYIucJMXI7NgeEieFrN9I5N2Oj&signer=media-rpc&token=AAIAAU0AJDk1M2NkZTIwLTdmYTktNGZmMC04YTQyLTc5MGM0YjA0ZjIyNAAAAAABofQJD8iuNdmfFUHj1dfTTym7n8-dUkxnZs-DRt_FL7oNGYJZVQ'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p world-characters/dojo-kazan
          curl --fail --location --retry 3 --silent --show-error "$SHINPI_URL" -o world-characters/dojo-kazan/shinpi-no-kemuri.png
          curl --fail --location --retry 3 --silent --show-error "$IWAO_URL" -o world-characters/dojo-kazan/iwao.png
          curl --fail --location --retry 3 --silent --show-error "$GENKI_URL" -o world-characters/dojo-kazan/genki.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for n in ["shinpi-no-kemuri","iwao","genki"]:
              p=Path("world-characters/dojo-kazan")/(n+".png")
              b=p.read_bytes()
              assert b[:8] == b"\x89PNG\r\n\x1a\n", f"{p} is not PNG"
              w,h=struct.unpack(">II",b[16:24])
              assert (w,h)==(1024,1536), f"{p}: unexpected dimensions {(w,h)}"
              print(f"Validated portrait {n} native 1024x1536: {len(b)} bytes")
          PY
      - name: Publish exact-resolution portraits and remove ephemeral install workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-characters/dojo-kazan/*.png
          git rm -f .github/workflows/install-dojo-kazan-portraits-20261119.yml
          git commit -m "Add three approved Dojo Kazan character portraits"
          git push origin HEAD:main
