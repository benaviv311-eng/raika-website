name: Build Iwao canonical transparent website portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-iwao-transparent-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install segmentation and image tools
        run: python -m pip install "rembg[cpu]>=2.0.60" "Pillow>=11" numpy scipy
      - name: Preserve exact existing Iwao character and remove only external scene background
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, json, base64,hashlib
          import numpy as np
          from PIL import Image, ImageDraw
          from rembg import new_session, remove
          path=Path('world-characters/dojo-kazan/iwao.webp')
          data=path.read_bytes()
          original=Image.open(io.BytesIO(data)).convert('RGBA')
          assert min(original.size)>1000, ('Unexpected original',original.size)
          # Use the approved website original rather than inventing new features or edits.
          inputrgb=Image.new('RGB',original.size,(24,19,20))
          inputrgb.paste(original,(0,0),original.getchannel('A'))
          segmented=remove(inputrgb,session=new_session('isnet-general-use'),
                           alpha_matting=False,post_process_mask=True).convert('RGBA')
          a=np.array(segmented.getchannel('A'),dtype=np.uint8)
          if (a>=210).mean()<0.22 or (a<20).mean()<0.32:
              raise ValueError('Segmentation mask failed coverage QA')
          # Mask original colors, not regenerated colors: preserve icon, anatomy and fabric.
          image=Image.fromarray(np.asarray(original,dtype=np.uint8).copy(),'RGBA')
          image.putalpha(Image.fromarray(a,'L'))
          target=Path('world-characters/dojo-kazan/iwao-site-cutout.webp')
          if target.exists(): raise ValueError('Cutout target already exists: refusing overwrite')
          image.save(target,'WEBP',lossless=True,method=6)
          output=Image.open(target)
          assert output.size==original.size and output.mode=='RGBA'
          assert np.asarray(output.getchannel('A')).min()==0
          # QA preview on site's light and dark backgrounds
          sw,sh=520,510
          preview=Image.new('RGB',(sw*3,sh),(14,22,20))
          painter=ImageDraw.Draw(preview)
          for i,(name,im,bgcolor) in enumerate([
              ('CANONICAL SOURCE',original,(15,21,20)),
              ('CUTOUT DARK STAGE',image,(18,31,25)),
              ('CUTOUT LIGHT STAGE',image,(214,196,169))]):
              im=im.copy()
              im.thumbnail((sw-20,sh-42),Image.Resampling.LANCZOS)
              stage=Image.new('RGBA',im.size,(*bgcolor,255))
              stage.alpha_composite(im)
              px=i*sw+(sw-im.width)//2
              py=6+(sh-42-im.height)//2
              preview.paste(stage.convert('RGB'),(px,py))
              painter.text((i*sw+15,sh-26),name,fill=(247,219,169))
          buff=io.BytesIO()
          preview.save(buff,'JPEG',quality=85,optimize=True)
          Path('world-characters/dojo-kazan/iwao-review.jpg.base64.txt').write_text(base64.b64encode(buff.getvalue()).decode())
          manifest={'original':str(path),'display':str(target),'pixels':original.size,
                    'approvedArtworkSha256':hashlib.sha256(data).hexdigest(),
                    'preservedCanonicalColor':True,'alphaTransparentFraction':round(float((a<=20).mean()),3),
                    'outputBytes':target.stat().st_size}
          Path('world-characters/dojo-kazan/iwao-site-cutout.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest))
          PY
      - name: Archive prepared cutout and preview separately from original; leave site unchanged
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-characters/dojo-kazan/iwao-site-cutout.webp
          git add world-characters/dojo-kazan/iwao-site-cutout.json
          git add world-characters/dojo-kazan/iwao-review.jpg.base64.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare transparent Iwao website file from approved original, leave site unchanged'
          for n in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
