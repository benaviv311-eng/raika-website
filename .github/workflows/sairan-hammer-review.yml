name: Sairan pose 2 — Artlist original background cleanup (review only)
on:
  push:
    branches: [review/sairan-cleanup-20261118]
    paths: [.github/workflows/sairan-hammer-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/sairan-cleanup-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install "Pillow>=10,<12" "numpy<3" "rembg[cpu]==2.0.67" scipy
      - name: Create source-preserving cutout and review
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, json, base64
          import numpy as np
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          from scipy import ndimage as ndi
          from rembg import remove,new_session
          root=Path('world-characters')
          src=root/'sairan-hammer-kick-approved.png'
          dest=root/'review-preview/sairan-pose2-artlist'
          dest.mkdir(parents=True,exist_ok=True)
          original=Image.open(src).convert('RGBA')
          W,H=original.size
          assert (W,H)==(2752,1536),original.size
          rgb=np.array(original.convert('RGB'))
          # Detect the repeated checkerboard colors from areas outside the figure.
          exterior=np.concatenate((rgb[60:-60,10:750,:].reshape(-1,3),
                                   rgb[60:-60,2150:-10,:].reshape(-1,3)),axis=0)
          colors,counts=np.unique(exterior,axis=0,return_counts=True)
          largest=np.argsort(counts)[-12:][::-1]
          bgcolors=[(colors[i].tolist(),int(counts[i])) for i in largest]
          # Start from the approved PNG, not earlier background-removed derivatives.
          session=new_session('isnet-general-use')
          mask=remove(original.convert('RGB'),session=session,only_mask=True,post_process_mask_mask=False) if False else remove(original.convert('RGB'),session=session,only_mask=True,post_process_mask=True)
          raw=np.array(mask.convert('L'))
          # Exact checkerboard pixels are unequivocally background, even if a
          # segmentation model mistook a checkered patch for an object.
          hit=np.zeros((H,W),dtype=bool)
          for c,n in bgcolors:
              if n>2000 and max(c)-min(c)<16:
                  color=np.array(c,dtype=np.int16)
                  hit |= np.max(np.abs(rgb.astype(np.int16)-color),axis=2)<=3
          refined=raw.astype(np.float32)
          refined[hit]=0
          # Feather alpha only (never repaint source character pixels).
          refined=ndi.gaussian_filter(refined,0.60)
          refined=np.where(refined<8,0,refined)
          # Preserve detected lightning strands with actual non-neutral pixels.
          # Any blue pixel still must be in the original figure neighborhood.
          red=rgb[:,:,0].astype(np.int16); green=rgb[:,:,1].astype(np.int16); blue=rgb[:,:,2].astype(np.int16)
          bright_blue=(blue>red+15)&(blue>green+5)&(green>120)&(blue>160)
          core=ndi.binary_dilation(bright_blue,iterations=1)
          # Keep only blue strands near the visible body / raised foot and not remote artifacts.
          roi=np.zeros((H,W),dtype=bool);roi[0:H,840:2040]=True
          refined[roi&core]=np.maximum(refined[roi&core],np.where(bright_blue[roi&core],238,refined[roi&core]))
          refined=np.clip(refined,0,255).astype('uint8')
          output=original.copy();output.putalpha(Image.fromarray(refined,'L'))
          mask_bounds=output.getchannel('A').point(lambda a:255 if a>=20 else 0).getbbox()
          assert mask_bounds
          x0,y0,x1,y1=mask_bounds
          pad=round(max(x1-x0,y1-y0)*.045)
          bounds=(max(0,x0-pad),max(0,y0-pad),min(W,x1+pad),min(H,y1+pad))
          piece=output.crop(bounds)
          piece.save(dest/'hammer-kick-cutout-CANDIDATE.png',optimize=True)
          # Reference pose 1 and original source pose 2 for visual comparison.
          reference=Image.open(root/'sairan-palm-strike-approved.png').convert('RGBA')
          backdrop=(16,26,23,255)
          tile_w,tile_h=750,950
          sheet=Image.new('RGBA',(tile_w*3,tile_h),backdrop)
          dr=ImageDraw.Draw(sheet)
          variants=[
            ("1 / APPROVED REFERENCE",reference),
            ("2 / ORIGINAL ARTLIST (checkerboard retained)",original.crop((780,0,2080,H))),
            ("2 / CANDIDATE - PNG ALPHA, FULL FOOT + LIGHTNING",piece)
          ]
          for i,(label,photo) in enumerate(variants):
              thumb=photo.copy()
              thumb.thumbnail((700,820),Image.Resampling.LANCZOS)
              px=i*tile_w+(tile_w-thumb.width)//2
              py=52+(830-thumb.height)//2
              backing=Image.new('RGBA',thumb.size,backdrop)
              backing.alpha_composite(thumb)
              sheet.alpha_composite(backing,(px,py))
              dr.text((i*tile_w+24,915),label,fill=(230,211,170,255))
          sheet.convert('RGB').save(dest/'pose2-comparison.jpg',quality=89,optimize=True)
          b=io.BytesIO();sheet.convert('RGB').save(b,'JPEG',quality=73,optimize=True)
          (dest/'pose2-comparison.jpg.base64.txt').write_text(base64.b64encode(b.getvalue()).decode('ascii'))
          report={'source':str(src),'source_size':[W,H],'checkerboard_top_colors':bgcolors,'checkerboard_pixels_removed':int(hit.sum()),'raw_mask_pct':round(float((raw>50).mean()),4),'new_mask_pct':round(float((refined>50).mean()),4),'mask_bounds':mask_bounds,'crop_bounds':bounds,'preview_size':piece.size,'source_rgb_unchanged':True,'site_updated':False}
          (dest/'report.json').write_text(json.dumps(report,indent=2))
          print(report)
          PY
      - name: Commit only to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-characters/review-preview/sairan-pose2-artlist/
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare source-accurate Sairan lightning kick candidate; review only'
          git push origin HEAD:review/sairan-cleanup-20261118
